<!doctype html>
<html lang="en-us" style="background-color: #111713; margin: 0; padding: 0;">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
    <title>Joust</title>
    <style>
      body {
        background-color: #111713;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #loadingCanvas, #canvas {
        display: block;
        margin: 0 auto;
        border: none;
        outline: none;
        max-width: 100%;
        height: auto;
      }
      #canvas {
        background-color: #000000;
      }
    </style>
  </head>
  <body>
    <center>
      <div style="margin: 0; padding: 0;">
        <!-- Made dimensions uniform so the loading frame mirrors the game frame box exactly -->
        <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="584" height="480"></canvas>
        <canvas id="canvas" oncontextmenu="event.preventDefault()" width="584" height="480" style="display: none;"></canvas>
      </div>
    </center>

    <script type='text/javascript'>
      function goFullScreen(){
            var canvas = document.getElementById("canvas");
            if(canvas.requestFullScreen) canvas.requestFullScreen();
            else if(canvas.webkitRequestFullScreen) canvas.webkitRequestFullScreen();
            else if(canvas.mozRequestFullScreen) canvas.mozRequestFullScreen();
      }
      
      var loadingContext = document.getElementById('loadingCanvas').getContext('2d');
      function drawLoadingText(text) {
        var canvas = loadingContext.canvas;

        loadingContext.fillStyle = "#111713";
        loadingContext.fillRect(0, 0, canvas.width, canvas.height);

        loadingContext.font = '2em arial';
        loadingContext.textAlign = 'center';
        loadingContext.fillStyle = "rgb(142, 195, 227)";
        
        loadingContext.fillText(text, canvas.width / 2, canvas.height / 2);
        loadingContext.fillText("Powered By Emscripten.", canvas.width / 2, canvas.height / 4);
        loadingContext.fillText("Powered By LÖVE.", canvas.width / 2, canvas.height / 4 * 3);
      }

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      window.addEventListener("keydown", function(e) {
        if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
          e.preventDefault();
        }
      }, false);

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 16777216,
        printErr: console.error.bind(console),
        canvas: (function() {
          return document.getElementById('canvas');
        })(),
        setStatus: function(text) {
          if (text) {
            drawLoadingText(text);
          } else if (Module.remainingDependencies === 0) {
            document.getElementById('loadingCanvas').style.display = 'none';
            document.getElementById('canvas').style.display = 'block';
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
    </script>
    <script type="text/javascript" src="game.js"></script>
    <script async type="text/javascript" src="love.js" onload="Love(Module)"></script>
  </body>
</html>
